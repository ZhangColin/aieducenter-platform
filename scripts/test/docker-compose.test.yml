# 测试环境 Docker Compose
# 只提供数据库服务，测试在主机上运行

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: aiedu-postgres-test
    ports:
      - "25432:5432"
    environment:
      POSTGRES_DB: aieducenter_test
      POSTGRES_USER: aiedu_test
      POSTGRES_PASSWORD: test123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiedu_test"]
      interval: 2s
      timeout: 3s
      retries: 5

  redis-test:
    image: redis:7-alpine
    container_name: aiedu-redis-test
    ports:
      - "26379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 3
